<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Thank You | MAV HR</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root{--ink:#111315;--warm:#947652;--cream:#f7f4ef;--muted:#666b6e}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}
    .header{background:var(--ink);padding:18px 24px}
    .header img{width:120px;height:58px;object-fit:contain}
    main{min-height:72vh;display:grid;place-items:center;padding:48px 24px}
    .card{max-width:720px;background:#fff;border-radius:18px;padding:46px;box-shadow:0 16px 44px rgba(0,0,0,.08);text-align:center}
    h1{font-size:42px;margin:0 0 18px}
    p{font-size:18px;line-height:1.6;color:var(--muted)}
    .button{display:inline-block;margin-top:18px;background:var(--warm);color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:10px}
  </style>
</head>
<body>
  <div class="header"><a href="/"><img src="mavhr-logo-white.svg" alt="MAV HR"></a></div>
  <main>
    <div class="card">
      <h1>Thank you.</h1>
      <p>Your benefits information has been submitted. MAV HR will review it and follow up regarding next steps.</p>
      <a class="button" href="/">Return to MAV HR</a>
    </div>
  </main>
</body>
</html>
